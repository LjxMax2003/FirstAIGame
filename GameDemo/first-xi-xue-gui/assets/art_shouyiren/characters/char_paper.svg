<svg xmlns="http://www.w3.org/2000/svg" width="128" height="160" viewBox="0 0 128 160">
  <!-- 剪纸婆婆：矮、驼、圆。剪影靠"重心最低 + 背部隆起"立住，
       五个里唯一头顶不过 50 的人 —— 一眼就能看出是位老人。 -->
  <defs>
    <radialGradient id="pg" gradientUnits="userSpaceOnUse" cx="64" cy="96" r="78">
      <stop offset="0" stop-color="#F0E3C6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#D8C49B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#D8C49B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE0C0"/><stop offset="1" stop-color="#CBB489"/>
    </linearGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EAD2"/><stop offset="1" stop-color="#DCC8A4"/>
    </linearGradient>
  </defs>
  <rect width="128" height="160" fill="#08111E"/>
  <circle cx="64" cy="96" r="78" fill="url(#pg)"/>
  <path d="M137.5 80.0L134.5 100.7L125.8 119.7L112.8 136.4L94.8 147.3L74.6 154.0L53.6 152.2L33.5 146.8L15.1 136.4L2.0 119.8L-6.6 100.7L-11.7 80.0L-7.1 59.1L1.9 40.1L14.9 23.3L32.9 11.8L53.5 7.2L74.4 8.0L94.7 12.7L111.9 24.7L126.9 39.6L134.0 59.4Z" fill="#0F1B2D" opacity="0.85"/>

  <!-- 身体：矮胖的钟形，背部向右后隆起（驼背），底部铺得很宽 -->
  <path d="M38 100q6-12 20-16 8-3 16 0 14 4 18 16 4 12 2 30-2 18-8 22H44q-6-4-8-22-2-18 2-30z" fill="url(#cloth)"/>
  <!-- 剪纸纹样：贴在衣摆上的镂空（用底色挖洞，等于真的"剪"出来） -->
  <path d="M52 126l6-8 6 8-6 8z" fill="#08111E" opacity="0.75"/>
  <path d="M70 126l6-8 6 8-6 8z" fill="#08111E" opacity="0.75"/>
  <path d="M48 146h32" stroke="#A98F63" stroke-width="1.4" opacity="0.8"/>
  <path d="M56 100q8 6 16 0" stroke="#A98F63" stroke-width="1.4" fill="none" opacity="0.7"/>
  <!-- 斜襟：老人衣裳是右衽，一条斜线从锁骨到腋下 -->
  <path d="M64 88l-12 14" stroke="#B99A6C" stroke-width="2" fill="none"/>

  <!-- 头：低、圆、略缩在肩里（脖子几乎没有） -->
  <ellipse cx="64" cy="66" rx="19" ry="19" fill="url(#skin3)"/>
  <!-- 白发盘髻：头顶一个圆髻 + 一根木簪横穿 -->
  <path d="M45 62q0-16 19-16t19 16q-6-9-19-9t-19 9z" fill="#EDE7DC"/>
  <circle cx="64" cy="44" r="8" fill="#EDE7DC"/>
  <path d="M56 43h16" stroke="#8A6A45" stroke-width="1.8" stroke-linecap="round"/>
  <!-- 额头与眼角的纹（不画法令纹，128px 下只会糊成一团） -->
  <path d="M54 60q4-2 8 0M70 60q4-2 8 0" stroke="#B99A6C" stroke-width="1.2" fill="none"/>
  <!-- 弯着的眼睛 + 笑纹：老人笑起来眼睛是弯的 -->
  <path d="M53 68q3-3 6 0M69 68q3-3 6 0" stroke="#2A2A2A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M59 76q5 3 10 0" stroke="#9A5A3A" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <circle cx="50" cy="74" r="3.4" fill="#C0532F" opacity="0.2"/>
  <circle cx="78" cy="74" r="3.4" fill="#C0532F" opacity="0.2"/>

  <!-- 右手：一把张开的剪刀（两片刃 + 两个红绳缠的柄环） -->
  <path d="M84 112l16-16M84 112l18-2" stroke="#B9BEC8" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="88" cy="118" r="3.6" fill="none" stroke="#C0532F" stroke-width="2"/>
  <circle cx="95" cy="115" r="3.6" fill="none" stroke="#C0532F" stroke-width="2"/>
  <circle cx="103" cy="93" r="1.6" fill="#EDE7DC"/>
  <circle cx="105" cy="107" r="1.6" fill="#EDE7DC"/>

  <rect x="6" y="6" width="116" height="148" rx="4" fill="none" stroke="#D8C49B" stroke-width="2" opacity="0.5"/>
</svg>
