<svg xmlns="http://www.w3.org/2000/svg" width="128" height="160" viewBox="0 0 128 160">
  <!-- 灯彩匠：瘦高。剪影靠"窄、长"立住 —— 和铁花匠并排时宽度差近一倍。 -->
  <defs>
    <radialGradient id="lg" gradientUnits="userSpaceOnUse" cx="64" cy="90" r="78">
      <stop offset="0" stop-color="#FF8A3C" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#E0631E" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#E0631E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4A2C"/><stop offset="1" stop-color="#4A2A18"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EEDC"/><stop offset="1" stop-color="#E0CFAC"/>
    </linearGradient>
  </defs>
  <rect width="128" height="160" fill="#08111E"/>
  <circle cx="64" cy="90" r="78" fill="url(#lg)"/>
  <path d="M137.5 80.0L134.5 100.7L125.8 119.7L112.8 136.4L94.8 147.3L74.6 154.0L53.6 152.2L33.5 146.8L15.1 136.4L2.0 119.8L-6.6 100.7L-11.7 80.0L-7.1 59.1L1.9 40.1L14.9 23.3L32.9 11.8L53.5 7.2L74.4 8.0L94.7 12.7L111.9 24.7L126.9 39.6L134.0 59.4Z" fill="#0F1B2D" opacity="0.85"/>

  <!-- 窄肩长袍：肩宽只有 38，一直垂到脚面 -->
  <path d="M47 88q17-9 34 0l7 66H40z" fill="url(#robe)"/>
  <!-- 竹骨竖纹：编灯骨的人身上挂着自己的手艺 -->
  <path d="M52 96v56M58 94v58M70 94v58M76 96v56" stroke="#B98247" stroke-width="1.2" opacity="0.5"/>
  <path d="M47 100h34" stroke="#C98B4B" stroke-width="2" opacity="0.7"/>
  <!-- 领口的交叠 -->
  <path d="M64 88l-9 12 5 3 4-6 4 6 5-3z" fill="#EBD9B4"/>

  <!-- 脖子细长 -->
  <path d="M60 74h8v12h-8z" fill="#CDBB95"/>
  <!-- 头：窄长脸 -->
  <ellipse cx="64" cy="56" rx="16" ry="21" fill="url(#skin2)"/>
  <!-- 毡帽：宽檐 + 圆顶，帽檐是横向的一条，和铁花匠的头巾完全不同的形状 -->
  <path d="M46 44q18-16 36 0z" fill="#2E2A26"/>
  <path d="M48 44q16-12 32 0" stroke="#4A423A" stroke-width="1.4" fill="none"/>
  <rect x="40" y="43" width="48" height="5" rx="2.5" fill="#3A332C"/>
  <circle cx="64" cy="28" r="3" fill="#E8B04B"/>
  <!-- 细眉、细眼 -->
  <path d="M54 54h6M68 54h6" stroke="#2A2A2A" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="57" cy="59" r="1.9" fill="#1A1A1A"/>
  <circle cx="71" cy="59" r="1.9" fill="#1A1A1A"/>
  <path d="M61 67q3 2 6 0" stroke="#9A5A3A" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- 右臂提灯：手臂下垂，灯挂在手里，灯笼本身是画面第二亮的东西 -->
  <path d="M80 94l9 16 2 12" stroke="url(#robe)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <rect x="78" y="98" width="12" height="6" rx="2" fill="#EBD9B4"/>
  <path d="M91 122v6" stroke="#C98B4B" stroke-width="2"/>
  <!-- 宫灯：八角身 + 提梁 + 顶端宝盖 -->
  <circle cx="91" cy="140" r="18" fill="#FF9A3C" opacity="0.22"/>
  <path d="M91 126l-9 5v10l9 5 9-5v-10z" fill="#E0631E"/>
  <path d="M82 131h18M82 141h18M91 126v20" stroke="#7A2F0C" stroke-width="1.2" opacity="0.8"/>
  <ellipse cx="91" cy="140" rx="5" ry="6" fill="#FFD98A"/>
  <path d="M84 124h14" stroke="#E8B04B" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M91 155v3" stroke="#E8B04B" stroke-width="2" stroke-linecap="round"/>
  <circle cx="91" cy="147" r="1.6" fill="#FFE9B0"/>

  <rect x="6" y="6" width="116" height="148" rx="4" fill="none" stroke="#E0631E" stroke-width="2" opacity="0.55"/>
</svg>
